    <script>
      // Apply the saved day/night mode before first paint (no flash).
      try {
        var m = localStorage.getItem("sakura:mode");
        if (m !== "day" && m !== "night") {
          m = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        }
        document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
